name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  REL_REPO: Alesnguyen/bg-sales-management-releases
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Kiểm tra mã truy cập kho phát hành
        shell: bash
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "::error::Thiếu secret RELEASES_TOKEN. Xem PHAT-HANH-RIENG-TU.md"; exit 1; fi
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - run: npm install
      # Chỉ build, không để công cụ build tự đăng (trước đây đăng thiếu file). Việc đăng làm ở bước sau để bảo đảm đủ file.
      - run: npx electron-builder --win nsis --publish never
      - name: Đăng bản phát hành sang kho công khai (đủ file cài, latest.yml, blockmap)
        if: github.event_name == 'push'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          EXE=$(ls dist/*.exe | head -n1)
          SAFE=$(basename "$EXE" | tr ' ' '-')
          if [ ! -f dist/latest.yml ]; then
            cat > "dist/ly.js" <<'EOF'
          const c=require("crypto"),fs=require("fs"),p=process.argv[2],n=process.argv[3],v=process.argv[4];
          const b=fs.readFileSync(p),h=c.createHash("sha512").update(b).digest("base64");
          fs.writeFileSync("dist/latest.yml","version: "+v+"\nfiles:\n  - url: "+n+"\n    sha512: "+h+"\n    size: "+b.length+"\npath: "+n+"\nsha512: "+h+"\nreleaseDate: '"+new Date().toISOString()+"'\n");
          EOF
            node dist/ly.js "$EXE" "$SAFE" "$V"
          fi
          # Tên tệp do công cụ build tạo ra có dấu cách; sao chép sang tên có dấu gạch ngang rồi mới tải lên.
          mkdir -p dist/up
          cp "$EXE" "dist/up/$SAFE"
          for f in dist/latest.yml dist/*.blockmap; do
            [ -e "$f" ] && cp "$f" "dist/up/$(basename "$f" | tr ' ' '-')"
          done
          ls -la dist/up
          # Ghi chú phát hành = mục tương ứng trong CHANGELOG.md (ứng dụng hiển thị ghi chú này khi báo có bản mới).
          awk -v h="## $V" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Phiên bản $V" > dist/notes.md
          if gh release view "v$V" --repo "$REL_REPO" >/dev/null 2>&1; then
            ASSETS=$(gh release view "v$V" --repo "$REL_REPO" --json assets --jq '.assets[].name')
            if echo "$ASSETS" | grep -qxF "$SAFE" && echo "$ASSETS" | grep -qxF "latest.yml"; then
              echo "Bản v$V đã đầy đủ, bỏ qua."
              exit 0
            fi
            echo "Bản v$V đã có nhưng thiếu file, đang bổ sung."
            gh release upload "v$V" dist/up/* --repo "$REL_REPO" --clobber
          else
            gh release create "v$V" dist/up/* --repo "$REL_REPO" --title "$V" --notes-file dist/notes.md --latest \
              || gh release upload "v$V" dist/up/* --repo "$REL_REPO" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: BG-Sales-Management-Setup
          path: dist/*.exe
