name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - name: Chọn chế độ phát hành
        id: rel
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ] && ! git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then echo "mode=always" >> "$GITHUB_OUTPUT"; else echo "mode=never" >> "$GITHUB_OUTPUT"; fi
      - run: npx electron-builder --win nsis --publish ${{ steps.rel.outputs.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bảo đảm bản phát hành có latest.yml (cho tự cập nhật)
        if: steps.rel.outputs.mode == 'always'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ ! -f dist/latest.yml ]; then
            cat > "$RUNNER_TEMP/ly.js" <<'EOF'
          const c=require("crypto"),fs=require("fs"),p=process.argv[2],n=process.argv[3],v=process.argv[4];
          const b=fs.readFileSync(p),h=c.createHash("sha512").update(b).digest("base64");
          fs.writeFileSync("dist/latest.yml","version: "+v+"\nfiles:\n  - url: "+n+"\n    sha512: "+h+"\n    size: "+b.length+"\npath: "+n+"\nsha512: "+h+"\nreleaseDate: '"+new Date().toISOString()+"'\n");
          EOF
            EXE=$(ls dist/*.exe | head -n1)
            node "$RUNNER_TEMP/ly.js" "$EXE" "$(basename "$EXE")" "$V"
          fi
          gh release upload "v$V" dist/latest.yml $(ls dist/*.blockmap 2>/dev/null) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: BG-Sales-Management-Setup
          path: dist/*.exe
